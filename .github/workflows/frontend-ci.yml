name: Frontend CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/member-1-architecture
      - feature/member-3-hr-dashboard
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run test --if-present
